[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenwash"
version = "0.1.0"
description = "Find the CI failures GitHub hides: workflow runs that only went green because someone re-ran them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["github-actions", "ci", "flaky-tests", "workflow-runs", "retries"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
greenwash = "greenwash.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/greenwash"

[tool.hatch.build.targets.wheel]
packages = ["src/greenwash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
