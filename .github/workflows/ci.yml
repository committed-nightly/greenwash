name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  dogfood-offline:
    # Run the real CLI, through the real subprocess transport, against a
    # `gh` that serves the captured fixtures. This is the deterministic
    # half: it pins the output of the incident in tests/fixtures and does
    # not care whether GitHub is up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: build a gh that serves the fixtures
        run: |
          cat > "$RUNNER_TEMP/gh" <<'SH'
          #!/bin/sh
          # greenwash calls: gh api -H Accept:... <path>
          path="$4"
          case "$path" in
            */attempts/*)
              id=$(echo "$path" | sed 's|.*/runs/\([0-9]*\)/attempts/\([0-9]*\).*|\1-attempt-\2|')
              file="tests/fixtures/run-$id.json" ;;
            */actions/runs\?*)
              file="tests/fixtures/runs-list.json" ;;
            *)
              file="" ;;
          esac
          if [ -n "$file" ] && [ -f "$file" ]; then
            cat "$file"
          else
            echo '{"message":"Not Found","status":"404"}'
            exit 1
          fi
          SH
          chmod +x "$RUNNER_TEMP/gh"

      # `code=0; cmd || code=$?` rather than `cmd; code=$?`, because these
      # steps run under `bash -e` and the whole point is a non-zero exit.
      - name: the recorded incident is found, and exits 1
        run: |
          code=0
          greenwash --repo committed-nightly/ops --limit 30 --gh "$RUNNER_TEMP/gh" > out.txt || code=$?
          cat out.txt
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          grep -q 'green on retry, 1 hidden failure' out.txt || { echo "no finding"; exit 1; }
          grep -q '7m 45s' out.txt || { echo "attempt 1 duration wrong"; exit 1; }
          grep -q 'attempts/1' out.txt || { echo "no link to the hidden attempt"; exit 1; }

      - name: a repository with no runs is an error, not a pass
        # The failure this whole family exists to avoid: a check that never
        # ran must not exit 0.
        run: |
          cat > "$RUNNER_TEMP/empty-gh" <<'SH'
          #!/bin/sh
          echo '{"workflow_runs":[]}'
          SH
          chmod +x "$RUNNER_TEMP/empty-gh"
          code=0
          greenwash --repo o/r --gh "$RUNNER_TEMP/empty-gh" || code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

  dogfood-live:
    # The other half: talk to the real API with today's payloads. This is
    # what catches GitHub changing a field name — the offline job would
    # happily keep passing against fixtures captured in 2026.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: run against this repository for real
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=0
          greenwash --repo "$GITHUB_REPOSITORY" --all --limit 50 || code=$?
          # 0 or 1 are both real answers. 2 means it could not run at all,
          # which is the only outcome that says the tool is broken.
          test "$code" -ne 2 || { echo "greenwash could not run against the live API"; exit 1; }

      - name: --json stays parseable against live payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=0
          greenwash --repo "$GITHUB_REPOSITORY" --json --limit 50 > live.json || code=$?
          test "$code" -ne 2 || { echo "greenwash could not run"; exit 1; }
          python -c "import json,sys; d=json.load(open('live.json')); assert d['summary']['checked'] >= 1, d"
